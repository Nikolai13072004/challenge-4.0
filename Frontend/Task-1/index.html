<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Три символа на Вратах</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="scene">
        <img
          class="scene__background"
          src="background.png"
          alt="Старинные ворота замка с тремя круглыми камнями"
        />

        <img
          class="scene__glyph scene__glyph--first"
          src="glyph-1.svg"
          alt="Первый древний символ"
        />
        <img
          class="scene__glyph scene__glyph--second"
          src="glyph-2.svg"
          alt="Второй древний символ"
        />
        <img
          class="scene__glyph scene__glyph--third"
          src="glyph-3.svg"
          alt="Третий древний символ"
        />
      </div>
    </main>
  </body>
</html>
