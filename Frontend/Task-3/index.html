<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель загадки</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="puzzle">
        <header class="puzzle__header">
            <p class="puzzle__label">АРТЕФАКТ - ЗАГАДКА 3</p>
            <h1>Найди такое же созвездие</h1>
            <p class="puzzle__instruction">Сравни главный символ с тремя вариантами на двери сокровищницы.</p>
        </header>
        <div class="door">
            <img class="door__background" src="images/door.png" alt="Дверь сокровищницы с четырьмя круглыми площадками">
            <img class="door__symbol door__symbol_main" src="images/main-constellation.png" alt="Главное созвездие">
            <img class="door__symbol door__symbol_first" src="images/constellation-1.png" alt="Первый вариант созвездия">
            <img class="door__symbol door__symbol_second" src="images/constellation-2.png" alt="Второй вариант созвездия">
            <img class="door__symbol door__symbol_third" src="images/constellation-3.png" alt="Третий вариант созвездия">
        </div>
    </main>
</body>
</html>
